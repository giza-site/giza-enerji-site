<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Giza Enerji | Elektrik Faturası Analizi</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

/* NAVBAR */
.navbar {
    background: #0f172a;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.navbar img {
    height: 40px;
}

.navbar span {
    color: white;
    font-size: 22px;
    font-weight: 700;
}

/* HERO */
.hero {
    position: relative;
    height: 90vh;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
}

/* PİRAMİT ARKA PLAN */
.pyramid-bg {
    position: absolute;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    width: 1200px;
    opacity: 0.12; /* silik */
    z-index: 1;
}

/* CONTENT */
.hero-content {
    position: relative;
    z-index: 2;
    max-width: 900px;
}

.hero h1 {
    font-size: 60px;
    color: #0f172a;
    font-weight: 800;
    margin-bottom: 20px;
}

.hero p {
    font-size: 20px;
    color: #475569;
    margin-bottom: 30px;
}

/* BUTTON */
.btn {
    background: #facc15;
    color: black;
    padding: 18px 35px;
    border-radius: 12px;
    font-weight: bold;
    text-decoration: none;
    font-size: 18px;
    display: inline-block;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .hero h1 {
        font-size: 34px;
    }

    .pyramid-bg {
        width: 700px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <img src="giza-01.png" alt="Logo">
    <span>GIZA ENERJİ</span>
</div>

<!-- HERO -->
<section class="hero">

    <!-- PİRAMİT -->
    <img src="piramit.png" class="pyramid-bg">

    <!-- YAZI -->
    <div class="hero-content">
        <h1>Elektrik Faturanı %30'a Kadar Düşür</h1>
        <p>Uzman enerji danışmanlığı ile gereksiz maliyetleri ortadan kaldır</p>
        <a href="#" class="btn">Ücretsiz Analiz Al</a>
    </div>

</section>

</body>
</html>
