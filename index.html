<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giza Enerji</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

h1 {
  font-size:42px;
  font-weight:bold;
}

.btn {
  display:inline-block;
  margin-top:20px;
  padding:15px 25px;
  background:#facc15;
  color:black;
  font-weight:bold;
  text-decoration:none;
  border-radius:10px;
}

.section {
  background:white;
  color:black;
  padding:40px;
  border-radius:20px;
  margin-top:40px;
}

input {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

</style>

</head>

<body>

<div class="container">
  <h1>Elektrik faturanız gereğinden fazla olabilir.</h1>
  <p>Giza Enerji olarak faturalarınızı analiz ediyor, maliyetlerinizi düşürüyoruz.</p>

  <a class="btn" href="https://wa.me/905422368482" target="_blank">
    Faturamı Gönder
  </a>

  <div class="section">
    <h2>Fatura Hesaplama</h2>

```
<label>Tüketim (kWh)</label>
<input id="kwh" type="number" placeholder="Örn: 1000">

<label>Birim fiyat (TL)</label>
<input id="price" type="number" placeholder="Örn: 3">

<button class="btn" onclick="hesapla()">Hesapla</button>

<h3 id="sonuc"></h3>
```

  </div>
</div>

<script>
function hesapla(){
  let kwh = document.getElementById(\"kwh\").value;
  let price = document.getElementById(\"price\").value;

  let total = kwh * price;

  document.getElementById(\"sonuc\").innerText =
    \"Tahmini fatura: \" + total.toFixed(2) + \" TL\";
}
</script>

</body>
</html>
